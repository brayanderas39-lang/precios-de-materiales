<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Precios de Materiales</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#171717;background:#f4f5f7}
*{box-sizing:border-box}body{margin:0;background:#f4f5f7}
header{background:#111827;color:#fff;padding:24px 18px 20px;border-radius:0 0 22px 22px}
h1{font-size:25px;margin:0}.sub{margin-top:5px;opacity:.72;font-size:14px}
main{max-width:720px;margin:auto;padding:16px 16px 100px}
.searchWrap{position:relative}.search{width:100%;padding:14px 45px 14px 16px;border:0;border-radius:14px;background:#fff;font-size:16px;box-shadow:0 2px 10px #0000000c;margin:0 0 14px}.clear{position:absolute;right:8px;top:8px;border:0;border-radius:50%;width:32px;height:32px;background:#eef0f3;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.cat{border:0;background:#fff;border-radius:15px;padding:16px 12px;text-align:left;font-weight:700;box-shadow:0 2px 9px #00000009}.cat span{display:block;font-size:23px;margin-bottom:7px}
.secondary{width:100%;margin-top:10px;padding:12px;border:1px solid #ddd;border-radius:12px;background:#fff;font-weight:700}
.sectionHead{display:flex;justify-content:space-between;align-items:center;margin-top:20px}.sectionHead h2{margin:0;font-size:19px}.count{color:#666;font-size:13px}
.card{background:#fff;border-radius:16px;padding:15px;margin:10px 0;box-shadow:0 2px 10px #00000009}.card.clickable{cursor:pointer}.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.name{font-weight:750}.price{font-size:19px;font-weight:800;white-space:nowrap}.meta{color:#666;font-size:13px;margin-top:5px}
.detailPhoto{width:100%;max-height:260px;object-fit:cover;border-radius:12px;margin-bottom:13px}
.actions{display:flex;gap:8px;margin-top:13px}.actions button{border:0;border-radius:10px;padding:9px 12px;font-weight:700}.edit{background:#eef2ff}.delete{background:#fee2e2}
.fab{position:fixed;right:20px;bottom:20px;border:0;border-radius:999px;padding:16px 20px;background:#111827;color:#fff;font-weight:800;box-shadow:0 6px 20px #0004}
.back{border:0;background:none;color:#fff;padding:0;margin-bottom:10px;font-size:16px}
form,.calc,.preview{background:#fff;border-radius:16px;padding:16px}.field{margin-bottom:13px}.field label{display:block;font-size:13px;font-weight:750;margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid #d9dce1;border-radius:10px;background:#fff;font:inherit}.hint{color:#666;font-size:12px;margin-top:5px}
.save{width:100%;padding:13px;border:0;border-radius:12px;background:#111827;color:#fff;font-weight:800}
.preview{margin:14px 0;background:#f8fafc}.previewTitle{font-size:12px;color:#666}.previewText{font-weight:700;margin-top:5px}
.calc{margin-top:14px}.calc h3{margin:0 0 8px}.calcInput{width:100%;padding:13px;border:1px solid #d9dce1;border-radius:10px;font-size:18px}.calcResult{font-size:25px;font-weight:850;margin-top:12px}.small{color:#666;font-size:13px}
.paintQuick{margin-top:14px;background:#fff8e1;border:1px solid #f0c84b;border-radius:14px;padding:14px}.paintQuick h3{margin:0 0 10px}.paintQuickRow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px dashed #d8c98d}.paintQuickRow:last-child{border-bottom:0}.paintQuickPrice{font-size:19px;font-weight:850}
.empty{color:#666;padding:15px 3px}
.hidden{display:none!important}
</style>
</head>

<body>

<header>
<button id="backBtn" class="back hidden" onclick="goHome()">← Volver</button>
<h1>🧰 Precios de Materiales</h1>
<div class="sub">Guarda tus precios y calcula cualquier cantidad.</div>
</header>

<main>

<section id="home">

<div class="searchWrap">
<input id="search" class="search" placeholder="🔍 Buscar material..." autocomplete="off">
<button class="clear" onclick="clearSearch()">×</button>
</div>

<div id="categories" class="grid"></div>

<button class="secondary" onclick="newCategory()">＋ Nueva categoría</button>

<div class="sectionHead">
<h2>Todos los materiales</h2>
<span id="count" class="count"></span>
</div>

<div id="materials"></div>

<button class="fab" onclick="openForm()">＋ Agregar material</button>

</section>

<section id="categoryView" class="hidden">

<h2 id="categoryTitle"></h2>
<div id="categoryMaterials"></div>

<button class="fab" onclick="openForm()">＋ Agregar material</button>

</section>

<section id="detailView" class="hidden">

<h2 id="detailTitle"></h2>
<div id="detail"></div>

</section>

<section id="formView" class="hidden">

<h2 id="formTitle">Agregar material</h2>

<form id="materialForm">

<div class="field">
<label>Material</label>
<input id="name" required placeholder="Ej. Tubo cuadrado 2×2">
</div>

<div class="field">
<label>Categoría</label>
<select id="category"></select>
</div>

<div class="field">
<label>Precio de compra</label>
<input id="price" required type="number" min="0" step="0.01" placeholder="10.00">
</div>

<div class="field">
<label>Unidad de compra</label>

<select id="purchaseUnit">
<option>Unidad</option>
<option>Barra</option>
<option>Rollo</option>
<option>Lámina</option>
<option>Kg</option>
<option>Litro</option>
<option>Galón</option>
<option>Otra</option>
</select>

</div>

<div class="field">

<label>Unidad para calcular</label>

<select id="calcUnit">
<option>Metro</option>
<option>m²</option>
<option>Pie</option>
<option>Kg</option>
<option>Litro</option>
<option>Galón</option>
<option>Unidad</option>
</select>

<div class="hint">
Ej.: una barra de tubo trae 6 metros. Para pintura por galón, usa Galón.
</div>

</div>

<div class="field">

<label>Cantidad que trae una unidad de compra</label>

<input id="purchaseQty"
required
type="number"
min="0.0001"
step="0.0001"
placeholder="6">

</div>

<div class="field">

<label>Proveedor (opcional)</label>

<input id="supplier" placeholder="Ej. Ferretería">

</div>

<div class="field">

<label>Foto del material (opcional)</label>

<input id="photo" type="file" accept="image/*">

</div>

<div class="preview">

<div class="previewTitle">Vista previa</div>

<div id="previewText" class="previewText">
Completa los datos para ver el resumen.
</div>

</div>

<button id="saveBtn" class="save">
Guardar material
</button>

</form>

</section>

</main>

<script>

const defaultCategories=[
["🔩","Tubos"],
["📄","Láminas"],
["▰","Platinas"],
["📐","Ángulos"],
["🔥","Electrodos"],
["🪚","Discos"],
["🎨","Pintura"],
["📦","Otras"]
];

let categories=
JSON.parse(localStorage.getItem("pm_categories")||"null")
||defaultCategories;

let materials=
JSON.parse(localStorage.getItem("pm_materials")||"[]");

let editing=-1,
currentCategory="";

const $=id=>document.getElementById(id);

const esc=s=>String(s??"").replace(
/[&<>"']/g,
c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[c])
);

function persist(){

localStorage.setItem(
"pm_materials",
JSON.stringify(materials)
);

localStorage.setItem(
"pm_categories",
JSON.stringify(categories)
);

}

function init(){

renderCategories();

populateCategorySelect();

renderMaterials();

["name","price","purchaseUnit","calcUnit","purchaseQty"]
.forEach(id=>
$(id).addEventListener("input",updatePreview)
);

$("category").addEventListener(
"change",
updatePreview
);

$("search").addEventListener(
"input",
renderMaterials
);

$("materialForm").addEventListener(
"submit",
saveMaterial
);

}

function renderCategories(){

$("categories").innerHTML=

categories.map(([icon,name],i)=>

`<div class="cat"
onclick="showCategory('${esc(name).replace(/'/g,"&#39;")}')">

<span>${icon}</span>

<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">

<b>${esc(name)}</b>

<button
onclick="event.stopPropagation();deleteCategory(${i})"
style="padding:6px 9px;border:0;border-radius:8px;background:#fee2e2;color:#991b1b">

🗑️

</button>

</div>

</div>`

).join("");

}

function deleteCategory(i){

const category=categories[i][1];

const hasMaterials=
materials.some(
m=>m.category===category
);

if(hasMaterials){

alert(
"No puedes eliminar esta categoría porque tiene materiales guardados dentro de ella."
);

return;

}

if(
!confirm(
"¿Quieres eliminar la categoría \""+
category+
"\"?"
)
)return;

categories.splice(i,1);

persist();

renderCategories();

populateCategorySelect();

}

function populateCategorySelect(selected){

$("category").innerHTML=

categories.map(
([,name])=>`<option>${esc(name)}</option>`
).join("");

if(selected)
$("category").value=selected;

}

function renderMaterials(){

const q=
$("search").value
.trim()
.toLowerCase();

let list=

materials
.map((m,i)=>({...m,i}))
.filter(m=>

(m.name+
" "+
m.category+
" "+
(m.supplier||""))
.toLowerCase()
.includes(q)

);

list.reverse();

$("count").textContent=
materials.length+
" material"+
(materials.length===1?"":"es");

$("materials").innerHTML=

list.length
?list.map(materialCard).join("")
:"<div class='empty'>No hay materiales guardados.</div>";

}

function materialCard(m){

return `

<div class="card clickable"
onclick="showDetail(${m.i})">

${m.photo?
`<img class="detailPhoto"
src="${m.photo}"
alt="">`
:""}

<div class="row">

<div class="name">
${esc(m.name)}
</div>

<div class="price">
$${Number(m.price).toFixed(2)}
/
${esc(m.purchaseUnit)}
</div>

</div>

<div class="meta">

${esc(m.category)}
·
${Number(m.purchaseQty)}
${esc(m.calcUnit)}
por
${esc(m.purchaseUnit)}

</div>

</div>

`;

}

function showCategory(cat){

currentCategory=cat;

$("home").classList.add("hidden");
$("detailView").classList.add("hidden");
$("formView").classList.add("hidden");
$("categoryView").classList.remove("hidden");
$("backBtn").classList.remove("hidden");

$("categoryTitle").textContent=cat;

const list=

materials
.map((m,i)=>({...m,i}))
.filter(m=>m.category===cat);

$("categoryMaterials").innerHTML=

list.length
?list.map(materialCard).join("")
:"<div class='empty'>No hay materiales en esta categoría.</div>";

}

function showDetail(i){

const m=materials[i];

$("home").classList.add("hidden");
$("categoryView").classList.add("hidden");
$("formView").classList.add("hidden");
$("detailView").classList.remove("hidden");
$("backBtn").classList.remove("hidden");

$("detailTitle").textContent=m.name;

const perUnit=
Number(m.price)/
Number(m.purchaseQty);

const isPaintByGallon=

String(m.category)
.toLowerCase()
.includes("pintur")
&&
m.calcUnit==="Galón";

let quickPaint="";

if(isPaintByGallon){

quickPaint=`

<div class="paintQuick">

<h3>🎨 Precios por galón</h3>

<div class="paintQuickRow">

<span>¼ galón</span>

<span class="paintQuickPrice">
$${(perUnit*0.25).toFixed(2)}
</span>

</div>

<div class="paintQuickRow">

<span>½ galón</span>

<span class="paintQuickPrice">
$${(perUnit*0.5).toFixed(2)}
</span>

</div>

<div class="paintQuickRow">

<span>1 galón</span>

<span class="paintQuickPrice">
$${perUnit.toFixed(2)}
</span>

</div>

</div>

`;

}

$("detail").innerHTML=

`<div class="card">

${m.photo?
`<img class="detailPhoto"
src="${m.photo}"
alt="Foto de ${esc(m.name)}">`
:""}

<div class="row">

<div>

<b>Precio de compra</b>

<div class="meta">

$${Number(m.price).toFixed(2)}
por
${esc(m.purchaseUnit)}

</div>

</div>

<div class="price">

$${perUnit.toFixed(2)}
/
${esc(m.calcUnit)}

</div>

</div>

<div class="meta">

${Number(m.purchaseQty)}
${esc(m.calcUnit)}
por
${esc(m.purchaseUnit)}
·
${esc(m.category)}

</div>

${m.supplier?
`<p>
<b>Proveedor:</b>
${esc(m.supplier)}
</p>`
:""}

${quickPaint}

<div class="calc">

<h3>🧮 Calcular cantidad</h3>

<div class="small">

Escribe cualquier cantidad de
${esc(m.calcUnit)}.

</div>

<input
id="quantity"
class="calcInput"
type="number"
min="0"
step="0.0001"
placeholder="Ej. ${isPaintByGallon?"0.75":"200"}"
oninput="calculate(${i})">

<div id="calcResult"
class="calcResult">
—
</div>

</div>

<div class="actions">

<button
class="edit"
onclick="editMaterial(${i})">

✏️ Editar

</button>

<button
class="delete"
onclick="deleteMaterial(${i})">

🗑️ Eliminar

</button>

</div>

</div>`;

}

function calculate(i){

const q=
Number($("quantity").value);

if(!q){

$("calcResult").textContent="—";

return;

}

$("calcResult").textContent=

"$"+
(
Number(materials[i].price)/
Number(materials[i].purchaseQty)
*q
).toFixed(2);

}

function openForm(){

editing=-1;

$("formTitle").textContent=
"Agregar material";

$("saveBtn").textContent=
"Guardar material";

$("home").classList.add("hidden");
$("categoryView").classList.add("hidden");
$("detailView").classList.add("hidden");
$("formView").classList.remove("hidden");
$("backBtn").classList.remove("hidden");

$("materialForm").reset();

populateCategorySelect();

updatePreview();

}

function editMaterial(i){

editing=i;

const m=materials[i];

$("formTitle").textContent=
"Editar material";

$("saveBtn").textContent=
"Guardar cambios";

$("home").classList.add("hidden");
$("categoryView").classList.add("hidden");
$("detailView").classList.add("hidden");
$("formView").classList.remove("hidden");
$("backBtn").classList.remove("hidden");

$("name").value=m.name;
$("price").value=m.price;
$("purchaseUnit").value=m.purchaseUnit;
$("calcUnit").value=m.calcUnit;
$("purchaseQty").value=m.purchaseQty;
$("supplier").value=m.supplier||"";
$("photo").value="";

populateCategorySelect(m.category);

updatePreview();

}

function updatePreview(){

const n=
$("name").value.trim();

const p=
$("price").value;

const u=
$("purchaseUnit").value;

const cu=
$("calcUnit").value;

const q=
$("purchaseQty").value;

if(!n&&!p&&!q){

$("previewText").textContent=
"Completa los datos para ver el resumen.";

return;

}

$("previewText").textContent=

(n||"Material")
+
" · $"
+
(p||"0.00")
+
" / "
+
u
+
" · "
+
(q||"0")
+
" "
+
cu;

}

function saveMaterial(e){

e.preventDefault();

const file=
$("photo").files[0];

const finish=photo=>{

const old=
editing>=0
?materials[editing]
:null;

const m={

name:$("name").value.trim(),

category:$("category").value,

price:Number($("price").value),

purchaseUnit:$("purchaseUnit").value,

calcUnit:$("calcUnit").value,

purchaseQty:Number($("purchaseQty").value),

supplier:$("supplier").value.trim(),

photo:photo||old?.photo||""

};

if(editing>=0)
materials[editing]=m;
else
materials.push(m);

persist();

goHome();

};

if(file){

const r=new FileReader();

r.onload=()=>
finish(r.result);

r.readAsDataURL(file);

}else{

finish("");

}

}

function deleteMaterial(i){

if(
confirm("¿Eliminar este material?")
){

materials.splice(i,1);

persist();

goHome();

}

}

function newCategory(){

const name=
prompt(
"Nombre de la nueva categoría:"
);

if(!name?.trim())
return;

const clean=
name.trim();

if(
categories.some(
c=>
c[1]
.toLowerCase()
===
clean.toLowerCase()
)
){

alert(
"Esa categoría ya existe."
);

return;

}

const icon=
prompt(

"Escribe el icono para esta categoría:\n\n"
+
"Ejemplos: 🔩 📄 📐 🕸️ 🧰 ⚙️ 🔧 🎨"

);

if(!icon?.trim())
return;

categories.push(
[
icon.trim(),
clean
]
);

persist();

renderCategories();

populateCategorySelect();

}

function clearSearch(){

$("search").value="";

renderMaterials();

$("search").focus();

}

function goHome(){

currentCategory="";
editing=-1;

$("home").classList.remove("hidden");
$("categoryView").classList.add("hidden");
$("detailView").classList.add("hidden");
$("formView").classList.add("hidden");
$("backBtn").classList.add("hidden");

renderMaterials();

}

init();

</script>

</body>
</html>
